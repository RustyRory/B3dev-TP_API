name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Récupération du code depuis GitHub
      - uses: actions/checkout@v3

      # 2️⃣ Déploiement sur le VPS via SSH
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Déploiement démarré..."

            # Se placer dans le dossier de l'application
            cd /var/www/b3dev-api/serveurExpress || exit 1

            # Nettoyer les fichiers non suivis pour éviter les conflits
            git clean -fd
            echo "🧹 Fichiers non suivis supprimés"

            # Récupérer les dernières modifications
            git fetch origin main
            git reset --hard origin/main
            echo "✅ Mise à jour du code terminée"

            # Installer les dépendances
            npm install -g pm2
            echo "📦 Dépendances et pm2 installées"

            # Redémarrer l'application avec PM2
            if pm2 describe b3dev-api > /dev/null; then
              echo "Redémarrage du process PM2 existant..."
              pm2 restart b3dev-api
            else
              echo "Démarrage d'un nouveau process PM2..."
              pm2 start src/app.js --name b3dev-api
            fi

            # Vérification finale
            pm2 status b3dev-api

            echo "🎉 Déploiement terminé avec succès !"
