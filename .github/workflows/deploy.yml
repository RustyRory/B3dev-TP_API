name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Récupération du code depuis GitHub
      - uses: actions/checkout@v3

      # 2️⃣ Déploiement sur le VPS via SSH
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Déploiement démarré..."

            # Se placer dans le dossier de l'application
            cd /root/B3dev/B3dev-TP_API/serveurExpress || exit 1

            # Nettoyer les fichiers non suivis pour éviter les conflits
            git clean -fd
            echo "🧹 Fichiers non suivis supprimés"

            # Vérifier le repo et la branche avant mise à jour
            echo "📌 Avant mise à jour :"
            git status
            git log -1

            # Récupérer les dernières modifications
            git fetch origin main
            git reset --hard origin/main
            echo "✅ Mise à jour du code terminée"

            # Vérifier la version après mise à jour
            echo "📌 Après mise à jour :"
            git status
            git log -1

            # Installer les dépendances
            npm install
            echo "📦 Dépendances installées"

            # Redémarrer l'application avec PM2
            if pm2 describe tp-nodejs > /dev/null; then
              echo "Redémarrage du process PM2 existant..."
              pm2 restart tp-nodejs
            else
              echo "Démarrage d'un nouveau process PM2..."
              pm2 start app.js --name tp-nodejs
            fi

            # Vérification finale
            pm2 status tp-nodejs
            echo "🎉 Déploiement terminé avec succès !"
